<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFF4D6">
<title>가나다 블록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
/* Layout: 장난감 블록 — 위 아이·단계·탭, 가운데 놀이 화면, 아래 자음·모음·받침 블록 상자. 아이패드 가로는 좌우 2단. */
:root {
  --bg: #FFF4D6;
  --surface: #FFFFFF;
  --ink: #2B2940;
  --muted: #8A85A3;
  --line: #EADFBE;
  --guide: #E9E3CF;
  --cons: #2F6FDB;  --cons-deep: #1F4FA6;
  --vow: #E5484D;   --vow-deep: #B3262B;
  --fin: #8B4FC7;   --fin-deep: #64329A;
  --syl: #17936A;   --syl-deep: #0E6B4C;
  --star: #F5A524;
  --font: "Jua", "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --emoji: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1C1A2B; --surface: #2A2741; --ink: #F5F2FF; --muted: #A9A3C6; --line: #3B3760; --guide: #4A4570;
    --cons: #6E9DFF; --cons-deep: #3D66C4; --vow: #FF777C; --vow-deep: #C2464B; --fin: #B98AF0; --fin-deep: #7E52B8;
    --syl: #45CF97; --syl-deep: #23855E; --star: #FFC14D;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1C1A2B; --surface: #2A2741; --ink: #F5F2FF; --muted: #A9A3C6; --line: #3B3760; --guide: #4A4570;
  --cons: #6E9DFF; --cons-deep: #3D66C4; --vow: #FF777C; --vow-deep: #C2464B; --fin: #B98AF0; --fin-deep: #7E52B8;
  --syl: #45CF97; --syl-deep: #23855E; --star: #FFC14D;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; overscroll-behavior-y: contain; }
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--bg); }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; touch-action: manipulation; }
button:focus-visible, select:focus-visible, input:focus-visible, label:focus-within { outline: 4px solid var(--syl); outline-offset: 3px; }
.vh { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; pointer-events: none; }

.app {
  max-width: 1120px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 12px 28px;
  display: grid; gap: 16px;
  grid-template-columns: minmax(0, 1fr);
  grid-template-areas: "top" "main" "boxes";
}
@media (min-width: 880px) and (orientation: landscape) {
  .app { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); grid-template-areas: "top top" "main boxes"; align-items: start; column-gap: 28px; }
  .app.wide { grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "main"; }
}
.main { grid-area: main; display: grid; gap: 16px; min-width: 0; }
.section { display: grid; gap: 16px; min-width: 0; }

/* 상단 */
.topwrap { grid-area: top; display: grid; gap: 10px; min-width: 0; }
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.tabs { display: flex; background: var(--surface); border-radius: 999px; padding: 4px; box-shadow: 0 3px 0 var(--line); min-width: 0; }
.tab { padding: 10px 14px; border-radius: 999px; font-size: 17px; color: var(--muted); white-space: nowrap; }
.tab.on { background: var(--ink); color: var(--bg); }
.tools { display: flex; gap: 8px; flex-shrink: 0; }
.icon { width: 46px; height: 46px; border-radius: 50%; font-size: 22px; background: var(--surface); box-shadow: 0 3px 0 var(--line); display: grid; place-items: center; }
.icon:active, .tab:active, .lv:active, .who:active, .bookbtn:active { transform: translateY(2px); }
.icon.on { background: var(--ink); color: var(--bg); }

.probar { display: flex; gap: 8px; align-items: stretch; min-width: 0; }
.who { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; background: var(--surface); border-radius: 16px; padding: 6px 12px; box-shadow: 0 3px 0 var(--line); text-align: left; }
.who .ava { font-size: 28px; font-family: var(--emoji); }
.who .txt { min-width: 0; }
.who b { display: block; font-weight: normal; font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.who small { display: block; font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.today, .bookbtn { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--surface); border-radius: 16px; padding: 6px 10px; box-shadow: 0 3px 0 var(--line); white-space: nowrap; font-variant-numeric: tabular-nums; }
.today small, .bookbtn small { font-size: 12px; color: var(--muted); }
.today b, .bookbtn b { font-weight: normal; font-size: 17px; }
.today.pop b { color: var(--syl); }

.levels { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.lv { background: var(--surface); border-radius: 16px; padding: 8px 4px; box-shadow: 0 3px 0 var(--line); display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0; }
.lv b { font-weight: normal; font-size: 17px; white-space: nowrap; }
.lv small { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.lv.on { background: var(--ink); color: var(--bg); }
.lv.on small { color: var(--bg); opacity: .8; }
.lv.special.on { background: var(--star); color: #3A2600; }
.lv.special.on small { color: #3A2600; }
.lv .rec { color: var(--syl); }

/* 설정 */
.voice-note { background: var(--surface); border-radius: 16px; padding: 12px 14px; font-family: system-ui, sans-serif; font-size: 14px; line-height: 1.5; box-shadow: inset 0 0 0 2px var(--vow); }
.settings { background: var(--surface); border-radius: 22px; padding: 16px; box-shadow: 0 5px 0 var(--line); display: grid; gap: 14px; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; }
.settings h3 { margin: 0; font-family: var(--font); font-weight: normal; font-size: 20px; }
.srow { display: grid; grid-template-columns: 108px minmax(0, 1fr); align-items: center; gap: 10px; }
.srow > label, .srow > span { color: var(--muted); }
.srow select { width: 100%; min-width: 0; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); }
.rangewrap { display: flex; align-items: center; gap: 10px; min-width: 0; flex-wrap: wrap; }
.rangewrap input[type=range] { flex: 1; min-width: 0; accent-color: var(--syl); }
.rangewrap output { width: 58px; text-align: right; font-variant-numeric: tabular-nums; }
.textin { flex: 1; min-width: 0; max-width: 220px; padding: 10px 12px; border-radius: 12px; border: 2px solid var(--line); background: var(--bg); font-size: 16px; -webkit-user-select: text; user-select: text; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { padding: 8px 14px; border-radius: 999px; background: var(--bg); box-shadow: inset 0 0 0 2px var(--line); }
.seg button.on { background: var(--syl); color: #fff; box-shadow: none; }
.seg button:disabled { opacity: .35; }
.switch { width: 26px; height: 26px; accent-color: var(--syl); }
.sbtns { display: flex; gap: 8px; flex-wrap: wrap; }
.sbtns.center { justify-content: center; }
.btn { padding: 10px 18px; border-radius: 999px; background: var(--syl); color: #fff; box-shadow: 0 3px 0 var(--syl-deep); }
.btn.ghost { background: var(--bg); color: var(--ink); box-shadow: 0 3px 0 var(--line); }
.btn.big { font-size: 20px; padding: 14px 24px; }
.hint { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.55; }
.linkbtn { justify-self: start; color: var(--muted); font-size: 14px; text-decoration: underline; padding: 6px 0; font-family: system-ui, sans-serif; }
@media (max-width: 420px) { .srow { grid-template-columns: 1fr; gap: 6px; } }

/* 만들기: 조립대 */
.stage { background: var(--surface); border-radius: 28px; box-shadow: 0 6px 0 var(--line); padding: 18px 12px 16px; display: flex; align-items: center; justify-content: center; gap: clamp(4px, 1.6vw, 14px); }
.piece { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.op { font-size: clamp(24px, 6vw, 42px); color: var(--muted); margin-bottom: 40px; }
.slot { width: clamp(64px, 19vw, 108px); aspect-ratio: 1; max-width: 100%; border-radius: 20px; display: grid; place-items: center; font-size: clamp(38px, 11vw, 66px); line-height: 1; border: 3px dashed var(--line); color: var(--muted); }
.slot.c.on { border: 0; background: var(--cons); color: #fff; box-shadow: 0 5px 0 var(--cons-deep); }
.slot.v.on { border: 0; background: var(--vow); color: #fff; box-shadow: 0 5px 0 var(--vow-deep); }
.slot.f.on { border: 0; background: var(--fin); color: #fff; box-shadow: 0 5px 0 var(--fin-deep); }
.result { width: clamp(92px, 27vw, 164px); aspect-ratio: 1; max-width: 100%; border-radius: 26px; display: grid; place-items: center; font-size: clamp(58px, 17vw, 110px); line-height: 1; border: 3px dashed var(--line); color: var(--muted); }
.result.on { border: 0; background: var(--syl); color: #fff; box-shadow: 0 7px 0 var(--syl-deep); }
.stage.three { gap: clamp(3px, 1.2vw, 12px); padding-inline: 8px; }
.stage.three .slot { width: clamp(50px, 14.5vw, 92px); font-size: clamp(30px, 9vw, 56px); border-radius: 16px; }
.stage.three .result { width: clamp(78px, 22vw, 150px); font-size: clamp(48px, 14vw, 100px); }
.stage.three .op { font-size: clamp(18px, 4.5vw, 36px); }
.stage.three .cap { font-size: clamp(15px, 4vw, 22px); }
.slot.speaking, .result.speaking { outline: 5px solid var(--star); outline-offset: 4px; }
.cap { min-height: 32px; display: flex; gap: 3px; justify-content: center; align-items: center; font-size: clamp(20px, 5vw, 28px); white-space: nowrap; }
.cap.c { color: var(--cons); } .cap.v { color: var(--vow); } .cap.f { color: var(--fin); } .cap.s { color: var(--syl); }
.cap span { display: inline-block; transition: transform .15s ease, color .15s ease; }
.cap span.speaking, .cap.speaking span { transform: scale(1.35) translateY(-2px); color: var(--star); }
.cap .ph { font-size: 14px; color: var(--muted); }
.pop { animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { 0% { transform: scale(.4); } 100% { transform: scale(1); } }
.finrow { background: var(--surface); border-radius: 20px; padding: 12px; box-shadow: 0 4px 0 var(--line); display: grid; gap: 10px; }
.finrow .poolinfo { color: var(--fin); }
.finchips { display: flex; gap: 8px; flex-wrap: wrap; }
.finchip { min-width: 52px; padding: 8px 12px; border-radius: 14px; font-size: 26px; background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 var(--line); }
.finchip.on { background: var(--fin); color: #fff; box-shadow: 0 3px 0 var(--fin-deep); }
.finchip:active { transform: translateY(2px); }

/* 낱말 카드 */
.words { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; min-height: 150px; }
.card { background: var(--surface); border-radius: 22px; box-shadow: 0 5px 0 var(--line); padding: 14px 6px 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; min-width: 0; }
.card:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--line); }
.card.speaking { outline: 4px solid var(--star); outline-offset: 2px; }
.card .pic { font-size: clamp(44px, 12vw, 76px); line-height: 1.1; font-family: var(--emoji); }
.card .w { font-size: clamp(19px, 5vw, 28px); white-space: nowrap; }
.card .w b { font-weight: inherit; color: var(--syl); }
.card.talk { animation: wiggle .5s ease; }
@keyframes wiggle { 0%,100% { transform: rotate(0); } 25% { transform: rotate(-4deg) scale(1.04); } 75% { transform: rotate(4deg) scale(1.04); } }
.in { animation: rise .4s ease both; }
@keyframes rise { from { transform: translateY(14px) scale(.9); opacity: .2; } to { transform: none; opacity: 1; } }
.empty { grid-column: 1 / -1; border-radius: 22px; border: 3px dashed var(--line); display: grid; place-items: center; text-align: center; padding: 18px; gap: 8px; color: var(--muted); font-size: 18px; line-height: 1.5; }
.empty .big { font-size: 40px; }
.morerow { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.poolinfo { font-size: 15px; color: var(--muted); }

/* 쓰기 */
.writer { display: grid; gap: 14px; justify-items: center; }
.chips { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; width: 100%; }
.chip { display: inline-flex; align-items: baseline; gap: 8px; padding: 10px 16px; border-radius: 16px; background: var(--surface); box-shadow: inset 0 0 0 2px var(--line), 0 3px 0 var(--line); font-size: 17px; color: var(--muted); }
.chip b { font-weight: normal; font-size: 26px; line-height: 1; }
.chip.c b { color: var(--cons); } .chip.v b { color: var(--vow); } .chip.s b { color: var(--syl); }
.chip.on.c { background: var(--cons); color: #fff; box-shadow: 0 3px 0 var(--cons-deep); }
.chip.on.v { background: var(--vow); color: #fff; box-shadow: 0 3px 0 var(--vow-deep); }
.chip.on.s { background: var(--syl); color: #fff; box-shadow: 0 3px 0 var(--syl-deep); }
.chip.on b { color: #fff; }
.chip.big b { font-size: 34px; }
.chip.done:not(.on) { color: var(--syl); }
.chip.speaking { outline: 4px solid var(--star); outline-offset: 2px; }
.pad { position: relative; width: min(100%, 520px); aspect-ratio: 1; max-width: 100%; background: var(--surface); border-radius: 26px; box-shadow: inset 0 0 0 3px var(--line), 0 6px 0 var(--line); overflow: hidden; }
.pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#ink { touch-action: none; cursor: crosshair; }
.cheer { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--star); color: #3A2600; padding: 10px 20px; border-radius: 999px; font-size: 22px; white-space: nowrap; box-shadow: 0 4px 0 rgba(0,0,0,.15); animation: cheer .6s cubic-bezier(.3,1.6,.5,1); pointer-events: none; }
@keyframes cheer { from { transform: translateX(-50%) scale(.3); } to { transform: translateX(-50%) scale(1); } }
.padbar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.pbtn { display: inline-flex; align-items: center; gap: 6px; padding: 12px 18px; border-radius: 999px; background: var(--surface); box-shadow: 0 4px 0 var(--line); font-size: 18px; cursor: pointer; }
.pbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
.pbtn.go { background: var(--syl); color: #fff; box-shadow: 0 4px 0 var(--syl-deep); }
.pbtn.done { background: var(--star); color: #3A2600; box-shadow: 0 4px 0 #C98410; }
.pbtn.small { font-size: 15px; padding: 9px 14px; }
.padmsg { margin: 0; min-height: 26px; font-size: 19px; color: var(--muted); text-align: center; }

/* 듣고 맞히기 */
.quiz { display: grid; gap: 14px; min-width: 0; }
.qtop, .qfoot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.qtop .seg button, .qfoot .seg button { background: var(--surface); }
.qtop .seg button.on, .qfoot .seg button.on { background: var(--ink); color: var(--bg); }
.qscore { font-size: 24px; background: var(--surface); padding: 6px 14px; border-radius: 999px; box-shadow: 0 3px 0 var(--line); font-variant-numeric: tabular-nums; }
.qplay { display: flex; align-items: center; justify-content: center; gap: 12px; padding: 18px; border-radius: 26px; background: var(--syl); color: #fff; font-size: clamp(22px, 6vw, 30px); box-shadow: 0 6px 0 var(--syl-deep); }
.qplay .ear { font-size: 1.3em; }
.qplay:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--syl-deep); }
.qplay.speaking { outline: 5px solid var(--star); outline-offset: 4px; }
.qdots { display: flex; justify-content: center; gap: 10px; }
.dot { width: 34px; height: 34px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 3px var(--line); display: grid; place-items: center; font-size: 20px; }
.dot.now { box-shadow: inset 0 0 0 3px var(--syl); }
.dot.done { box-shadow: none; animation: pop .45s cubic-bezier(.3,1.6,.5,1); }
.qgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.qgrid .card { padding: 16px 8px 14px; transition: filter .25s ease; }
.qgrid .card.wait { filter: grayscale(1) opacity(.45); pointer-events: none; }
.qgrid.textonly .pic { display: none; }
.qgrid.textonly .w { font-size: clamp(30px, 9vw, 46px); padding: 18px 0; }
.card.right { background: var(--syl); color: #fff; box-shadow: 0 5px 0 var(--syl-deep); }
.card.right .w b { color: #fff; }
.card.wrong { opacity: .3; animation: shake .4s ease; }
@keyframes shake { 0%,100% { transform: none; } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

.nameempty { width: 100%; }

/* 모달 */
.modal { position: fixed; inset: 0; z-index: 50; background: rgba(20, 18, 35, .5); display: grid; place-items: center;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.panel { background: var(--surface); border-radius: 28px; width: min(100%, 580px); max-height: 100%; overflow: auto; padding: 20px; display: grid; gap: 14px; box-shadow: 0 8px 0 var(--line); }
.panel.center { justify-items: center; text-align: center; }
.panelhead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.panelhead h3 { margin: 0; font-weight: normal; font-size: 24px; }
.panel h4 { margin: 6px 0 0; font-weight: normal; font-size: 19px; }
.stickers { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }
.sticker { position: relative; background: var(--bg); border-radius: 18px; padding: 10px 4px 8px; display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.sticker:active { transform: scale(.95); }
.sticker .pic { font-size: 40px; line-height: 1.1; font-family: var(--emoji); }
.sticker .w { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.sticker .n { position: absolute; top: 4px; right: 6px; font-size: 12px; background: var(--star); color: #3A2600; border-radius: 999px; padding: 1px 6px; }
.sticker.speaking { outline: 3px solid var(--star); }
.bigemoji { font-size: 64px; line-height: 1; }
.roundtitle { margin: 0; font-weight: normal; font-size: 34px; }
.roundstars { font-size: 38px; letter-spacing: 4px; }
.roundnew { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; font-size: 40px; font-family: var(--emoji); }
.kids { display: flex; gap: 8px; flex-wrap: wrap; }
.kid { padding: 9px 16px; border-radius: 999px; background: var(--bg); box-shadow: inset 0 0 0 2px var(--line); font-size: 17px; }
.kid.on { background: var(--ink); color: var(--bg); box-shadow: none; }
.kid.add { color: var(--syl); }
.anis button { font-size: 16px; }
.anis button .e { font-family: var(--emoji); margin-right: 4px; }
.prof { display: grid; gap: 12px; font-family: system-ui, -apple-system, sans-serif; font-size: 15px; }
.prof .srow > label, .prof .srow > span { font-family: var(--font); font-size: 16px; }
.hist { display: grid; gap: 8px; }
.hday { background: var(--bg); border-radius: 14px; padding: 10px 12px; display: grid; gap: 4px; }
.hday .d { font-size: 17px; }
.hday .d small { color: var(--muted); font-size: 13px; margin-left: 6px; }
.hday .n { font-size: 15px; font-variant-numeric: tabular-nums; }
.hday .items { font-size: 13.5px; color: var(--muted); font-family: system-ui, sans-serif; line-height: 1.55; word-break: keep-all; }
.toast { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 14px); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 999px; font-size: 20px; white-space: nowrap; box-shadow: 0 6px 18px rgba(0,0,0,.2); animation: cheer .5s cubic-bezier(.3,1.6,.5,1); pointer-events: none; }
.confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 55; pointer-events: none; }

/* 블록 상자 */
.boxes { grid-area: boxes; display: grid; gap: 14px; min-width: 0; }
.box { background: var(--surface); border-radius: 24px; padding: 12px 12px 16px; box-shadow: 0 5px 0 var(--line); }
.box h2 { margin: 2px 4px 10px; font-size: 16px; font-weight: normal; letter-spacing: 0.5px; display: flex; align-items: center; gap: 8px; }
.box h2 i { width: 12px; height: 12px; border-radius: 4px; display: inline-block; }
.box h2 small { font-size: 13px; color: var(--muted); letter-spacing: 0; }
.box.cons h2 { color: var(--cons); } .box.cons h2 i { background: var(--cons); }
.box.vow h2 { color: var(--vow); } .box.vow h2 i { background: var(--vow); }
.box.fin h2 { color: var(--fin); } .box.fin h2 i { background: var(--fin); }
.grid { display: grid; gap: 8px; grid-template-columns: repeat(7, minmax(0, 1fr)); }
.grid.five { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.jamo { aspect-ratio: 1; max-width: 100%; border-radius: 14px; display: grid; place-items: center; font-size: clamp(22px, 6vw, 38px); line-height: 1; background: var(--bg); }
.grid.five .jamo { aspect-ratio: 1.15; font-size: clamp(24px, 6.4vw, 40px); }
.cons .jamo { color: var(--cons); box-shadow: inset 0 0 0 2px var(--cons), 0 4px 0 var(--cons-deep); }
.vow .jamo { color: var(--vow); box-shadow: inset 0 0 0 2px var(--vow), 0 4px 0 var(--vow-deep); }
.fin .jamo { color: var(--fin); box-shadow: inset 0 0 0 2px var(--fin), 0 4px 0 var(--fin-deep); }
.jamo:active { transform: translateY(3px); }
.cons .jamo.sel { background: var(--cons); color: #fff; box-shadow: 0 4px 0 var(--cons-deep); }
.vow .jamo.sel { background: var(--vow); color: #fff; box-shadow: 0 4px 0 var(--vow-deep); }
.fin .jamo.sel { background: var(--fin); color: #fff; box-shadow: 0 4px 0 var(--fin-deep); }
.jamo.new { position: relative; }
.jamo.new::after { content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px; border-radius: 50%; background: var(--star); }

@media (prefers-reduced-motion: reduce) { .pop, .in, .card.talk, .cheer, .card.wrong, .jamo.hint, .jamo.bad, .sslot.bad, .toast { animation: none; } }

    speakSeq(items);
  });

  // 시작
  paintSettings(); paintWho(); paintToday(); paintBookCount(); setLevel(level);
})();
