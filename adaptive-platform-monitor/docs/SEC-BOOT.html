<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Security Secure Boot 상세</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1116}
a{color:#8AB8FF}a:hover{color:#B7D3FF}
.card{background:#161B22;border:1px solid #2A313C;border-radius:10px;padding:16px;box-sizing:border-box;min-width:0}
.h2{margin:0 0 10px;font-size:15px;font-weight:700}
.sub{font-weight:400;color:#9AA4B2;font-size:12px}
.mono{font-family:'JetBrains Mono',monospace}
.muted{color:#9AA4B2}
.btn{min-height:40px;padding:0 14px;border-radius:6px;border:1px solid #2A313C;background:#0E1116;color:#E6EAF0;font:inherit;font-size:13px;cursor:pointer}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:#9AA4B2;font-size:12px;font-weight:500;padding:8px;border-bottom:1px solid #2A313C;white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid #1E252F}
.chip{display:inline-block;font-size:12px;font-weight:500;border-radius:4px;padding:2px 8px;white-space:nowrap}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #1E252F;font-size:13px}
.boot{width:100%;text-align:left;padding:10px 12px;border-radius:8px;border:1px solid #2A313C;background:#0E1116;color:#E6EAF0;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:2px}
</style>
<script src="./runtime.js"></script>
</head>
<body>
<script type="text/x-dc-template" id="dc-template">
<div style="min-height: 100vh; background: #0E1116; color: #E6EAF0; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 14px; line-height: 1.5">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 24px; background: #161B22">
<a href="Main.html" style="font-size: 13px; text-decoration: none">← 대시보드</a>
<div style="flex: 1 1 260px">
<div class="muted" style="font-size: 12px">Security / SEC-04</div>
<h1 style="margin: 0; font-size: 18px">Secure Boot · 무결성</h1>
</div>
<div style="display: flex; flex-direction: column; gap: 4px"><span class="muted" style="font-size: 12px">칩 프로파일 (화면 구조는 같고 단계 이름만 바뀝니다)</span>
<div style="display: flex; gap: 4px"><sc-for list="{{chips}}" as="c" hint-placeholder-count="3"><button type="button" class="btn" aria-pressed="{{c.pressed}}" onClick="{{c.pick}}" style="min-height: 36px; font-size: 12px; background: {{c.bg}}; color: {{c.fg}}">{{c.label}}</button></sc-for></div></div>
</header>
<nav aria-label="Security 메뉴" style="display: flex; gap: 2px; padding: 0 24px; background: #161B22; border-bottom: 1px solid #2A313C; overflow-x: auto">
<sc-for list="{{tabs}}" as="b" hint-placeholder-count="8"><a href="{{b.href}}" style="padding: 12px 14px; white-space: nowrap; text-decoration: none; font-size: 13px; color: {{b.fg}}; border-bottom: 2px solid {{b.line}}">{{b.label}}</a></sc-for>
</nav>

<div style="display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; padding: 20px 24px 40px">

<aside class="card" aria-labelledby="bh-t" style="flex: 1 1 260px; display: flex; flex-direction: column; gap: 8px">
<h2 id="bh-t" class="h2">부팅 이력</h2>
<sc-for list="{{boots}}" as="b" hint-placeholder-count="6">
<button type="button" class="boot" onClick="{{b.pick}}" style="border-color: {{b.bd}}; background: {{b.bg}}">
<span style="display: flex; justify-content: space-between; gap: 8px"><span class="mono" style="font-weight: 500">{{b.id}}</span><span class="chip" style="color: {{b.fg}}; background: {{b.cbg}}">{{b.res}}</span></span>
<span class="mono muted" style="font-size: 12px">{{b.when}}</span>
<span style="font-size: 12px; color: #C9D1D9">{{b.note}}</span>
</button>
</sc-for>
</aside>

<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

<section class="card" aria-labelledby="ch-t">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; margin-bottom: 12px">
<h2 id="ch-t" class="h2" style="margin: 0">신뢰 체인 <span class="mono">{{boot.id}}</span> <span class="sub">{{boot.when}} · 총 {{boot.dur}}</span></h2>
<span class="chip" style="color: {{boot.fg}}; background: {{boot.cbg}}">{{boot.res}}</span>
</div>
<div style="display: flex; flex-direction: column; gap: 0">
<sc-for list="{{stages}}" as="s" hint-placeholder-count="6">
<div style="display: flex; gap: 14px">
<div style="display: flex; flex-direction: column; align-items: center; width: 20px; flex: none"><span style="width: 14px; height: 14px; border-radius: 50%; background: {{s.dot}}; margin-top: 16px"></span><span style="flex: 1; width: 2px; background: {{s.line}}"></span></div>
<div style="flex: 1; min-width: 0; padding: 10px 14px; margin-bottom: 10px; border-radius: 8px; border: 1px solid {{s.bd}}; background: {{s.bg}}">
<div style="display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px"><span style="font-weight: 700">{{s.name}}</span><span class="chip" style="color: {{s.fg}}; background: {{s.cbg}}">{{s.res}}</span></div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 4px 16px; margin-top: 6px; font-size: 12px">
<span><span class="muted">검증</span> {{s.how}}</span>
<span><span class="muted">키</span> <span class="mono">{{s.key}}</span></span>
<span><span class="muted">측정 해시</span> <span class="mono" style="color: {{s.hc}}">{{s.hash}}</span></span>
<span><span class="muted">소요</span> <span class="mono">{{s.ms}}</span></span>
</div>
<sc-if value="{{s.hasNote}}" hint-placeholder-val="{{false}}"><div style="font-size: 12px; margin-top: 6px; color: {{s.noteC}}">{{s.note}}</div></sc-if>
</div>
</div>
</sc-for>
</div>
<div class="muted" style="font-size: 12px">해시가 주황색이면 직전 부팅과 값이 달라진 단계입니다 (OTA 업데이트 등).</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 20px">
<section class="card" aria-labelledby="dv-t" style="flex: 1 1 300px">
<h2 id="dv-t" class="h2">dm-verity (rootfs)</h2>
<sc-for list="{{verity}}" as="v" hint-placeholder-count="5"><div class="kv"><span class="muted">{{v.k}}</span><span class="mono" style="color: {{v.c}}; text-align: right">{{v.v}}</span></div></sc-for>
</section>
<section class="card" aria-labelledby="im-t" style="flex: 1 1 360px">
<h2 id="im-t" class="h2">IMA 런타임 측정 <span class="sub">측정 3,412건 · 기준 불일치 0</span></h2>
<div class="mono" style="background: #0B0E12; border: 1px solid #1E252F; border-radius: 8px; font-size: 11px; overflow-x: auto">
<sc-for list="{{ima}}" as="m" hint-placeholder-count="5"><div style="display: flex; gap: 12px; padding: 5px 10px; border-bottom: 1px solid #161B22; white-space: nowrap"><span style="color: #8B95A3">{{m.pcr}}</span><span style="color: #C9D1D9">{{m.hash}}</span><span>{{m.path}}</span></div></sc-for>
</div>
</section>
</div>

<section class="card" aria-labelledby="pk-t">
<h2 id="pk-t" class="h2">앱 패키지 서명 <span class="sub">{{pkgSummary}}</span></h2>
<div style="overflow-x: auto">
<table class="tbl" style="min-width: 640px">
<thead><tr><th>패키지</th><th>버전</th><th>서명자</th><th>설치</th><th>결과</th></tr></thead>
<tbody>
<sc-for list="{{pkgs}}" as="p" hint-placeholder-count="7">
<tr style="background: {{p.rowBg}}"><td class="mono" style="font-size: 12px">{{p.name}}</td><td class="mono" style="font-size: 12px">{{p.ver}}</td><td class="mono" style="font-size: 12px; color: {{p.sc}}">{{p.signer}}</td><td class="mono" style="font-size: 12px; color: #9AA4B2">{{p.inst}}</td><td><span class="chip" style="color: {{p.fg}}; background: {{p.bg}}">{{p.res}}</span></td></tr>
</sc-for>
</tbody>
</table>
</div>
</section>

</main>
</div>
</div>
</script>
<script>
window.__DC_PROPS = {"$preview":{"width":1440,"height":1500}};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: '#214', chip: 'qc' };
  }
  renderVals() {
    const { sel, chip } = this.state;
    const ME = 'SEC-BOOT';
    const TABS = [['SEC', '개요'], ['SEC-IAM', '접근 거부'], ['SEC-PERM', '권한 매트릭스'], ['SEC-SECOC', 'SecOC'], ['SEC-BOOT', 'Secure Boot'], ['SEC-CERT', '인증서·키'], ['SEC-IDS', 'IDS 사건'], ['SEC-AUDIT', '감사 로그']];
    const tabs = TABS.map(([f, l]) => ({ href: f === ME ? '#' : f + '.html', label: l, fg: f === ME ? '#E6EAF0' : '#9AA4B2', line: f === ME ? '#4C9AFF' : 'transparent' }));
    const T = { ok: ['#3FB950', 'rgba(63,185,80,0.14)'], warn: ['#E3A008', 'rgba(227,160,8,0.14)'], crit: ['#F85149', 'rgba(248,81,73,0.14)'] };
    const B = [
      { id: '#214', when: '11-10 14:18:12', res: '통과', k: 'ok', note: '현재 부팅', dur: '7.4s', fail: null, changed: [] },
      { id: '#213', when: '11-09 08:02:44', res: '통과', k: 'ok', note: '변경 없음', dur: '7.3s', fail: null, changed: [] },
      { id: '#212', when: '11-08 19:40:05', res: '통과', k: 'ok', note: 'OTA v1.4.2 적용 후 첫 부팅', dur: '7.6s', fail: null, changed: [3, 4] },
      { id: '#211', when: '11-08 19:31:50', res: '실패', k: 'crit', note: '앱 패키지 서명 실패 1건', dur: '7.9s', fail: 5, changed: [] },
      { id: '#210', when: '11-07 07:55:13', res: '경고', k: 'warn', note: 'rootfs 블록 검증 오류 1건', dur: '8.8s', fail: null, warn: 4, changed: [] },
      { id: '#209', when: '11-06 18:22:31', res: '통과', k: 'ok', note: '변경 없음', dur: '7.4s', fail: null, changed: [] }
    ];
    const boots = B.map(b => ({ ...b, fg: T[b.k][0], cbg: T[b.k][1], bd: b.id === sel ? '#4C9AFF' : '#2A313C', bg: b.id === sel ? 'rgba(76,154,255,0.10)' : '#0E1116', pick: () => this.setState({ sel: b.id }) }));
    const boot = boots.find(b => b.id === sel);
    const NAMES = {
      qc: ['PBL (Boot ROM)', 'XBL', 'ABL', 'Linux 커널 + DTB', 'rootfs', '앱 패키지'],
      nxp: ['Boot ROM (AHAB)', 'SPL', 'U-Boot', 'Linux 커널 + DTB', 'rootfs', '앱 패키지'],
      ti: ['ROM (HS 디바이스)', 'R5 SPL', 'A72 SPL · U-Boot', 'Linux 커널 + DTB', 'rootfs', '앱 패키지']
    };
    const HOW = {
      qc: ['OTP 공개키 해시', 'RSA-3072 서명', 'RSA-3072 서명', 'AVB vbmeta 서명', 'dm-verity root hash', '패키지 서명 (ECDSA P-256)'],
      nxp: ['SRK 해시 (eFuse)', 'AHAB 컨테이너 서명', 'AHAB 컨테이너 서명', 'FIT 이미지 서명', 'dm-verity root hash', '패키지 서명 (ECDSA P-256)'],
      ti: ['MPK 해시 (eFuse)', 'X.509 인증서 서명', 'X.509 인증서 서명', 'FIT 이미지 서명', 'dm-verity root hash', '패키지 서명 (ECDSA P-256)']
    };
    const KEY = ['HW RoT', 'oem-boot-01', 'oem-boot-01', 'oem-kernel-02', 'oem-rootfs-02', 'oem-app-03'];
    const HASH = ['—', '7a1f…c09e', '41bb…9d20', 'e83c…12f7', '0d9a…77b4', '18/18 서명'];
    const HASH_NEW = { 3: 'f02d…a6e1', 4: '93c5…0b8f' };
    const MS = ['40ms', '310ms', '520ms', '330ms', '1.1s', '2.2s'];
    const stages = NAMES[chip].map((n, i) => {
      let k = 'ok', res = '통과', note = '';
      if (boot.fail === i) { k = 'crit'; res = '실패'; note = 'hmi_debug_tool 1.0.0: 서명자가 신뢰 목록에 없음 (dev-key) → 설치 거부, 나머지 17개는 정상 기동'; }
      if (boot.warn === i) { k = 'warn'; res = '경고'; note = '블록 0x3A11F 검증 실패 1회 → 재읽기 후 정상. eMMC 상태 확인 필요 (PER-03)'; }
      const changed = boot.changed.indexOf(i) >= 0;
      if (changed) note = '직전 부팅(#211)과 해시가 다름 — OTA v1.4.2 배포 기록과 일치';
      return {
        name: n, how: HOW[chip][i], key: KEY[i], hash: changed ? HASH_NEW[i] : (i === 5 && boot.fail === 5 ? '17/18 서명' : HASH[i]), hc: changed ? '#E3A008' : '#C9D1D9', ms: MS[i],
        res, fg: T[k][0], cbg: T[k][1], dot: T[k][0], line: i < 5 ? '#2A313C' : 'transparent',
        bd: k === 'ok' ? '#2A313C' : T[k][0], bg: k === 'ok' ? '#0E1116' : T[k][1], hasNote: note !== '', note, noteC: k === 'ok' ? '#E3A008' : T[k][0]
      };
    });
    const verity = [
      { k: '상태', v: boot.warn === 4 ? '오류 1건 후 복구' : '정상 (검증 중)', c: boot.warn === 4 ? '#E3A008' : '#3FB950' },
      { k: '오류 시 동작', v: 'restart_on_corruption', c: '#E6EAF0' },
      { k: 'root hash', v: boot.changed.indexOf(4) >= 0 ? '93c5…0b8f' : '0d9a…77b4', c: '#E6EAF0' },
      { k: '해시 알고리즘', v: 'sha256 · 4096B 블록', c: '#E6EAF0' },
      { k: '부팅 후 오류', v: boot.warn === 4 ? '1' : '0', c: boot.warn === 4 ? '#E3A008' : '#E6EAF0' }
    ];
    const ima = [
      { pcr: '10', hash: 'a3f0…19c2', path: '/usr/bin/em_daemon' },
      { pcr: '10', hash: '5bd1…e04a', path: '/usr/bin/planning_app' },
      { pcr: '10', hash: 'c77e…3b90', path: '/usr/lib/libara_com.so' },
      { pcr: '10', hash: '0e42…aa71', path: '/opt/ap/manifest/machine.json' },
      { pcr: '10', hash: '9b18…5d36', path: '/usr/bin/ai_infer_svc' }
    ];
    const P = [
      ['em_daemon', '2.3.1', 'oem-app-03', '11-08'], ['planning_app', '4.1.0', 'oem-app-03', '11-08'], ['perception_app', '3.9.2', 'oem-app-03', '11-08'],
      ['control_app', '2.0.7', 'oem-app-03', '10-21'], ['ai_infer_svc', '1.6.0', 'oem-app-03', '11-08'], ['hmi_bridge', '1.2.4', 'oem-app-03', '10-30']
    ];
    const pkgs = P.map(p => ({ name: p[0], ver: p[1], signer: p[2], inst: p[3], res: '검증됨', fg: T.ok[0], bg: T.ok[1], sc: '#C9D1D9', rowBg: 'transparent' }));
    if (boot.fail === 5) pkgs.unshift({ name: 'hmi_debug_tool', ver: '1.0.0', signer: 'dev-key (신뢰 목록 밖)', inst: '거부됨', res: '서명 실패', fg: T.crit[0], bg: T.crit[1], sc: '#F85149', rowBg: 'rgba(248,81,73,0.06)' });
    const mk = (labels) => labels.map(([k, l]) => ({ label: l, pressed: k === chip ? 'true' : 'false', pick: () => this.setState({ chip: k }), bg: k === chip ? '#4C9AFF' : '#0E1116', fg: k === chip ? '#0E1116' : '#C9D1D9' }));
    return {
      tabs, boots, boot, stages, verity, ima, pkgs, pkgSummary: boot.fail === 5 ? '19개 중 1개 실패 · 상위 7개 표시' : '18개 모두 검증 · 상위 6개 표시',
      chips: mk([['qc', 'Qualcomm'], ['nxp', 'NXP'], ['ti', 'TI']])
    };
  }
}
window.__DC_Component = Component;
</script>
</body>
</html>
