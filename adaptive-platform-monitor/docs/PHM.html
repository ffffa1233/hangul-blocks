<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PHM Safety 헬스</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0E1116}
a{color:#8AB8FF}a:hover{color:#B7D3FF}
.card{background:#161B22;border:1px solid #2A313C;border-radius:10px;padding:16px;box-sizing:border-box;min-width:0}
.h2{margin:0 0 10px;font-size:15px;font-weight:700}
.sub{font-weight:400;color:#9AA4B2;font-size:12px}
.tag{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:500;color:#8AB8FF;border:1px solid #2A4A75;border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle}
.mono{font-family:'JetBrains Mono',monospace}
.muted{color:#9AA4B2}
.btn{min-height:40px;padding:0 14px;border-radius:6px;border:1px solid #2A313C;background:#0E1116;color:#E6EAF0;font:inherit;font-size:13px;cursor:pointer}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;color:#9AA4B2;font-size:12px;font-weight:500;padding:8px;border-bottom:1px solid #2A313C}
.tbl td{padding:8px;border-bottom:1px solid #1E252F}
.chip{display:inline-block;font-size:12px;font-weight:500;border-radius:4px;padding:2px 8px;white-space:nowrap}
</style>
<script src="./runtime.js"></script>
</head>
<body>
<script type="text/x-dc-template" id="dc-template">
<div style="min-height: 100vh; background: #0E1116; color: #E6EAF0; font-family: 'Noto Sans KR', system-ui, sans-serif; font-size: 14px; line-height: 1.5">
<header style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 24px; background: #161B22; border-bottom: 1px solid #2A313C">
<a href="Main.html" style="font-size: 13px; text-decoration: none">← 대시보드</a>
<div style="flex: 1 1 260px">
<div style="display: flex; align-items: center; gap: 8px"><span class="mono" style="font-size: 11px; background: #1E252F; color: #C9D1D9; border-radius: 4px; padding: 2px 6px">PHM</span><h1 style="margin: 0; font-size: 18px">Safety · 헬스</h1></div>
<div class="muted" style="font-size: 12px">Alive · Deadline · Logical 감시 · 복구 동작 · Watchdog</div>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
<span class="mono" style="font-size: 12px; color: #9AA4B2">시뮬레이션 T+{{t}}s</span>
<button type="button" class="btn" onClick="{{toggle}}">{{runLabel}}</button>
<sc-for list="{{scenarios}}" as="s" hint-placeholder-count="2"><button type="button" class="btn" onClick="{{s.run}}" style="background: {{s.bg}}; color: {{s.fg}}">{{s.label}}</button></sc-for>
<button type="button" class="btn" onClick="{{reset}}">초기화</button>
</div>
</header>
<div style="display: flex; flex-wrap: wrap; align-items: flex-start; gap: 20px; padding: 20px 24px 40px">
<aside style="flex: 1 1 300px; max-width: 100%; display: flex; flex-direction: column; gap: 16px">
<section class="card" aria-labelledby="sc-t">
<h2 id="sc-t" class="h2">시나리오 진행</h2>
<sc-if value="{{noSc}}" hint-placeholder-val="{{true}}"><div class="muted" style="font-size: 13px">상단 시나리오 버튼을 누르면 단계별로 진행됩니다.</div></sc-if>
<sc-if value="{{hasSc}}" hint-placeholder-val="{{false}}">
<div style="font-size: 13px; font-weight: 500; margin-bottom: 6px">{{scTitle}}</div>
<sc-for list="{{steps}}" as="s" hint-placeholder-count="5">
<div style="display: flex; gap: 10px; padding: 6px 0"><span style="flex: none; width: 10px; height: 10px; border-radius: 50%; background: {{s.dot}}; margin-top: 5px"></span><div><div style="font-size: 13px; color: {{s.fg}}">{{s.text}}</div><div class="mono" style="font-size: 11px; color: #8B95A3">{{s.at}} · {{s.tag}}</div></div></div>
</sc-for>
</sc-if>
</section>
<section class="card" aria-labelledby="spec-t">
<h2 id="spec-t" class="h2">기능 명세 <span class="sub">{{specCount}}개</span></h2>
<sc-for list="{{spec}}" as="f" hint-placeholder-count="8">
<div style="padding: 9px 0; border-bottom: 1px solid #1E252F">
<div style="display: flex; align-items: center; gap: 8px"><span class="mono" style="font-size: 11px; color: #8AB8FF">{{f.id}}</span><span style="font-size: 13px; font-weight: 500; flex: 1">{{f.name}}</span><span style="font-size: 10px; color: {{f.pc}}; border: 1px solid {{f.pc}}; border-radius: 10px; padding: 0 6px; white-space: nowrap">{{f.ph}}</span></div>
<div class="muted" style="font-size: 12px; margin-top: 2px">{{f.desc}}</div>
</div>
</sc-for>
</section>
</aside>
<main style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

<section class="card" aria-labelledby="se-t">
<h2 id="se-t" class="h2">Supervised Entity <span class="tag">PHM-01</span><span class="tag">PHM-02</span></h2>
<div style="overflow-x: auto">
<table class="tbl" style="min-width: 760px">
<thead><tr><th>SE</th><th style="text-align: right">Alive 기대</th><th style="text-align: right">Alive 실측</th><th style="text-align: right">Deadline 예산</th><th style="text-align: right">최근 실측</th><th>Logical</th><th>종합</th></tr></thead>
<tbody>
<sc-for list="{{se}}" as="s" hint-placeholder-count="5">
<tr style="background: {{s.rowBg}}"><td class="mono" style="font-size: 12px">{{s.name}}</td><td class="mono" style="font-size: 12px; text-align: right; color: #9AA4B2">{{s.ae}}</td><td class="mono" style="font-size: 12px; text-align: right; color: {{s.ac}}">{{s.am}}</td><td class="mono" style="font-size: 12px; text-align: right; color: #9AA4B2">{{s.db}}</td><td class="mono" style="font-size: 12px; text-align: right; color: {{s.dc}}">{{s.dm}}</td><td style="font-size: 12px; color: {{s.lc}}">{{s.lg}}</td><td><span class="chip" style="color: {{s.fg}}; background: {{s.bg}}">{{s.st}}</span></td></tr>
</sc-for>
</tbody>
</table>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 20px">
<section class="card" aria-labelledby="dl-t" style="flex: 3 1 420px">
<h2 id="dl-t" class="h2">planning_app Deadline <span class="sub">최근 24 사이클 · 예산 20ms</span><span class="tag">PHM-03</span></h2>
<div style="position: relative; height: 140px; border-bottom: 1px solid #2A313C">
<div style="position: absolute; left: 0; right: 0; bottom: 57.1%; border-top: 1px dashed #F85149"></div>
<span class="mono" style="position: absolute; right: 0; bottom: 58%; font-size: 10px; color: #F85149">20ms</span>
<div style="position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 3px">
<sc-for list="{{dl}}" as="d" hint-placeholder-count="24"><div style="flex: 1; height: {{d.h}}; background: {{d.c}}; border-radius: 2px 2px 0 0"></div></sc-for>
</div>
</div>
<div style="display: flex; justify-content: space-between; margin-top: 6px; font-size: 12px; color: #9AA4B2"><span>-24</span><span>초과 <b class="mono" style="color: {{overC}}">{{over}}</b>회 / 24</span><span>현재</span></div>
</section>
<section class="card" aria-labelledby="jt-t" style="flex: 2 1 280px">
<h2 id="jt-t" class="h2">control_app 주기 jitter <span class="tag">PHM-08</span></h2>
<div style="display: flex; align-items: flex-end; gap: 6px; height: 110px; border-bottom: 1px solid #2A313C">
<sc-for list="{{jit}}" as="j" hint-placeholder-count="6"><div style="flex: 1; height: {{j.h}}; background: {{j.c}}; border-radius: 2px 2px 0 0"></div></sc-for>
</div>
<div style="display: flex; gap: 6px; margin-top: 4px"><sc-for list="{{jit}}" as="j" hint-placeholder-count="6"><span class="mono" style="flex: 1; text-align: center; font-size: 10px; color: #8B95A3">{{j.l}}</span></sc-for></div>
<div class="muted" style="font-size: 12px; margin-top: 6px">10ms 주기 기준 편차 분포 · 0.5ms 초과 구간 주황</div>
</section>
</div>

<section class="card" aria-labelledby="lg-t">
<h2 id="lg-t" class="h2">control_app Logical 감시 <span class="sub">체크포인트 순서</span><span class="tag">PHM-04</span></h2>
<div style="display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span class="muted" style="width: 52px; font-size: 12px">기대</span>
<sc-for list="{{cpExp}}" as="c" hint-placeholder-count="4"><div style="display: flex; align-items: center; gap: 8px"><div style="padding: 8px 12px; border-radius: 6px; border: 1px solid #2A313C; background: #0E1116; font-size: 12px"><span class="mono" style="color: #8AB8FF">{{c.id}}</span> {{c.name}}</div><sc-if value="{{c.arrow}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="color: #5A6472">→</span></sc-if></div></sc-for>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px"><span class="muted" style="width: 52px; font-size: 12px">실제</span>
<sc-for list="{{cpAct}}" as="c" hint-placeholder-count="4"><div style="display: flex; align-items: center; gap: 8px"><div style="padding: 8px 12px; border-radius: 6px; border: 1px solid {{c.b}}; background: {{c.bg}}; font-size: 12px; color: {{c.fg}}"><span class="mono">{{c.id}}</span> {{c.name}}</div><sc-if value="{{c.arrow}}" hint-placeholder-val="{{true}}"><span aria-hidden="true" style="color: #5A6472">→</span></sc-if></div></sc-for>
</div>
</div>
</section>

<div style="display: flex; flex-wrap: wrap; gap: 20px">
<section class="card" aria-labelledby="rc-t" style="flex: 3 1 420px">
<h2 id="rc-t" class="h2">복구 동작 이력 <span class="tag">PHM-06</span></h2>
<div style="overflow-x: auto">
<table class="tbl" style="min-width: 520px">
<thead><tr><th>시각</th><th>SE</th><th>실패 유형</th><th>복구 동작</th></tr></thead>
<tbody>
<sc-for list="{{rec}}" as="r" hint-placeholder-count="3">
<tr><td class="mono" style="font-size: 12px; color: #9AA4B2">{{r.time}}</td><td class="mono" style="font-size: 12px">{{r.se}}</td><td style="font-size: 12px; color: {{r.c}}">{{r.type}}</td><td style="font-size: 12px">{{r.act}}</td></tr>
</sc-for>
</tbody>
</table>
</div>
</section>
<section class="card" aria-labelledby="wd-t" style="flex: 2 1 280px">
<h2 id="wd-t" class="h2">Watchdog · Health Channel <span class="tag">PHM-05</span><span class="tag">PHM-07</span></h2>
<sc-for list="{{hc}}" as="h" hint-placeholder-count="5">
<div style="display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1E252F; font-size: 13px"><span style="color: #C9D1D9">{{h.k}}</span><span class="mono" style="color: {{h.c}}">{{h.v}}</span></div>
</sc-for>
</section>
</div>

</main>
</div>
</div>
</script>
<script>
window.__DC_PROPS = {"$preview":{"width":1440,"height":1500}};
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { t: 0, running: true, sc: null, s0: 0 };
  }
  componentDidMount() {
    this.timer = setInterval(() => { if (this.state.running) this.setState({ t: this.state.t + 1 }); }, 1000);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const { t, running, sc, s0 } = this.state;
    const el = sc ? t - s0 : -1;
    const T = { ok: ['#3FB950', 'rgba(63,185,80,0.14)'], warn: ['#E3A008', 'rgba(227,160,8,0.14)'], crit: ['#F85149', 'rgba(248,81,73,0.14)'], info: ['#4C9AFF', 'rgba(76,154,255,0.14)'], off: ['#9AA4B2', 'rgba(154,164,178,0.10)'] };
    const tn = (k) => T[k] || T.off;
    const PH = { MVP: '#4C9AFF', '2단계': '#3FB9A8', '3단계': '#9AA4B2' };
    const mkSteps = (L) => L.map((s, i) => { const n = L[i + 1]; const st = el < s.at ? 'p' : (n && el >= n.at ? 'd' : 'a'); const c = { d: ['#3FB950', '#C9D1D9', '완료'], a: ['#4C9AFF', '#E6EAF0', '진행 중'], p: ['#3A424E', '#8B95A3', '대기'] }[st]; return { at: '+' + s.at + 's', text: s.text, dot: c[0], fg: c[1], tag: c[2] }; });
    const clock = (sec) => { const b = 17 * 3600 + 30 * 60 + sec; return [Math.floor(b / 3600), Math.floor(b / 60) % 60, b % 60].map(x => String(x).padStart(2, '0')).join(':'); };
    const wv = (i, base, amp) => Math.max(0, base + amp * Math.sin(t * 1.1 + i * 1.7));
    const SC = {
      deadline: { label: 'Deadline 초과 → Degraded', steps: [
        { at: 0, text: '인식 객체 수 증가 (12 → 40), planning 연산량 상승' },
        { at: 2, text: 'Deadline 20ms 연속 3회 초과' },
        { at: 3, text: 'PHM: planning SE 상태 Failed 보고' },
        { at: 4, text: '복구 동작: Planning FG Degraded 모드 요청 (SM)' },
        { at: 7, text: '연산량 감소, 정상 복귀' }
      ]},
      logical: { label: 'Logical 순서 위반 → SafeStop', steps: [
        { at: 0, text: 'control_app 정상 순서 CP1→CP2→CP3→CP4' },
        { at: 1, text: 'CP3(E2E 검사)를 건너뛰고 CP4(출력) 도달' },
        { at: 2, text: 'PHM: Logical 감시 실패 감지' },
        { at: 3, text: '복구 동작: control_app 안전 상태 요청' },
        { at: 5, text: 'SM: VehicleMode → SafeStop 전환' }
      ]}
    };
    const dlNow = (e) => sc === 'deadline' && e >= 0 ? (e < 2 ? 19 : (e < 7 ? 26 : 15)) : 14;
    const dl = [];
    let over = 0;
    for (let k = t - 23; k <= t; k++) {
      const e = sc ? k - s0 : -1;
      const v = Math.max(4, dlNow(e) + 2.5 * Math.sin(k * 1.3) + 1.2 * Math.sin(k * 3.1));
      if (v > 20) over++;
      dl.push({ h: Math.min(100, v / 35 * 100) + '%', c: v > 20 ? '#F85149' : (v > 17 ? '#E3A008' : '#4C9AFF') });
    }
    const dCur = Math.max(4, dlNow(el) + 2.5 * Math.sin(t * 1.3));
    const dlFail = sc === 'deadline' && el >= 3 && el < 7;
    const lgFail = sc === 'logical' && el >= 2;

    const se = [
      { name: 'perception_app', ae: '10/s', am: wv(1, 10, 0.2), db: '50 ms', dm: wv(2, 38, 3), lg: '정상', k: 'ok' },
      { name: 'planning_app', ae: '20/s', am: wv(2, 20, 0.3), db: '20 ms', dm: dCur, lg: '정상', k: dlFail ? 'crit' : (dCur > 20 ? 'warn' : 'ok'), dk: dCur > 20 },
      { name: 'control_app', ae: '100/s', am: wv(3, 100, 0.5), db: '5 ms', dm: wv(4, 3, 0.3), lg: lgFail ? 'CP3 누락' : '정상', k: lgFail ? 'crit' : 'ok', lk: lgFail },
      { name: 'ai_infer_svc', ae: '10/s', am: wv(4, 10, 0.3), db: '80 ms', dm: wv(5, 11, 1), lg: '—', k: 'ok' },
      { name: 'safety_mon', ae: '50/s', am: wv(5, 50, 0.4), db: '10 ms', dm: wv(6, 2, 0.2), lg: '정상', k: 'ok' }
    ].map(s => ({
      name: s.name, ae: s.ae, am: s.am.toFixed(1) + '/s', ac: '#E6EAF0', db: s.db, dm: s.dm.toFixed(1) + ' ms', dc: s.dk ? '#F85149' : '#E6EAF0',
      lg: s.lg, lc: s.lk ? '#F85149' : '#9AA4B2', st: s.k === 'crit' ? 'Failed' : (s.k === 'warn' ? '경고' : 'OK'), fg: tn(s.k)[0], bg: tn(s.k)[1],
      rowBg: s.k === 'crit' ? 'rgba(248,81,73,0.06)' : 'transparent'
    }));

    const J = [['0.1', 46], ['0.2', 30], ['0.3', 14], ['0.4', 6], ['0.6', 3], ['1.0+', 1]];
    const jit = J.map((j, i) => ({ l: j[0], h: (j[1] + 2 * Math.sin(t + i)) / 50 * 100 + '%', c: i >= 4 ? '#E3A008' : '#4C9AFF' }));

    const CP = [['CP1', '입력 읽기'], ['CP2', '제어 연산'], ['CP3', 'E2E 검사'], ['CP4', '출력']];
    const cpExp = CP.map((c, i) => ({ id: c[0], name: c[1], arrow: i < 3 }));
    const act = sc === 'logical' && el >= 1 ? [CP[0], CP[1], CP[3]] : CP;
    const cpAct = act.map((c, i) => {
      const bad = sc === 'logical' && el >= 1 && c[0] === 'CP4';
      return { id: c[0], name: c[1] + (bad ? ' (CP3 없이 도달)' : ''), arrow: i < act.length - 1, b: bad ? '#F85149' : '#2B5D36', bg: bad ? 'rgba(248,81,73,0.14)' : 'rgba(63,185,80,0.10)', fg: bad ? '#F85149' : '#E6EAF0' };
    });

    const recBase = [{ time: '17:29:41', se: 'ai_infer_svc', type: 'Alive 실패', act: '프로세스 재시작 (EM)', k: 'crit' }, { time: '17:27:12', se: 'planning_app', type: 'Deadline 경고', act: '기록만 (임계 미만)', k: 'warn' }];
    const add = [];
    if (sc === 'deadline' && el >= 4) add.push({ time: clock(s0 + 4), se: 'planning_app', type: 'Deadline 실패', act: 'Planning FG → Degraded (SM)', k: 'crit' });
    if (sc === 'deadline' && el >= 7) add.unshift({ time: clock(s0 + 7), se: 'planning_app', type: '정상 복귀', act: 'Degraded 해제', k: 'ok' });
    if (sc === 'logical' && el >= 3) add.push({ time: clock(s0 + 3), se: 'control_app', type: 'Logical 실패', act: '안전 상태 요청', k: 'crit' });
    if (sc === 'logical' && el >= 5) add.unshift({ time: clock(s0 + 5), se: 'control_app', type: '후속 조치', act: 'VehicleMode → SafeStop', k: 'crit' });
    const rec = add.concat(recBase).map(r => ({ ...r, c: tn(r.k)[0] }));

    const hc = [
      { k: 'HW Watchdog', v: '정상 · 마지막 킥 ' + Math.round(wv(7, 40, 10)) + 'ms 전', c: '#3FB950' },
      { k: 'Watchdog 타임아웃', v: '200 ms', c: '#9AA4B2' },
      { k: 'Health: 전방 카메라', v: 'OK', c: '#3FB950' },
      { k: 'Health: 브레이크 ECU', v: 'OK', c: '#3FB950' },
      { k: 'Health: Planning 품질', v: dlFail ? 'Degraded' : 'Normal', c: dlFail ? '#E3A008' : '#3FB950' },
      { k: 'Health: 제어 출력', v: lgFail ? 'SafeStop 요청' : 'Normal', c: lgFail ? '#F85149' : '#3FB950' }
    ];

    const spec = [
      ['PHM-01', 'Supervised Entity 목록', 'SE별 종합 상태 (OK / 경고 / Failed / Expired)', 'MVP'],
      ['PHM-02', 'Alive 감시', '기대 주기 대비 실측 alive indication 수', 'MVP'],
      ['PHM-03', 'Deadline 감시', '체크포인트 사이 구간 시간, 예산 초과 횟수', 'MVP'],
      ['PHM-04', 'Logical 감시', '체크포인트 기대 순서와 실제 순서 비교', '2단계'],
      ['PHM-05', 'Health Channel', '센서·액추에이터·품질 상태 채널 표시', '2단계'],
      ['PHM-06', '복구 동작 이력', '실패 유형별 실행된 복구 (재시작, FG 전환, SafeStop)', 'MVP'],
      ['PHM-07', 'Watchdog', 'HW/SW watchdog 킥 간격, 타임아웃 여유', '2단계'],
      ['PHM-08', 'jitter 분석', '주기 태스크 편차 히스토그램', '2단계']
    ].map(s => ({ id: s[0], name: s[1], desc: s[2], ph: s[3], pc: PH[s[3]] }));
    const scenarios = Object.keys(SC).map(k => ({ label: SC[k].label, run: () => this.setState({ sc: k, s0: this.state.t, running: true }), bg: sc === k ? '#4C9AFF' : '#0E1116', fg: sc === k ? '#0E1116' : '#E6EAF0' }));
    return {
      t, runLabel: running ? '일시정지' : '재생', toggle: () => this.setState({ running: !this.state.running }),
      reset: () => this.setState({ t: 0, sc: null, s0: 0, running: true }),
      scenarios, noSc: !sc, hasSc: !!sc, scTitle: sc ? SC[sc].label : '', steps: sc ? mkSteps(SC[sc].steps) : [],
      spec, specCount: spec.length, se, dl, over: String(over), overC: over > 0 ? '#F85149' : '#E6EAF0', jit, cpExp, cpAct, rec, hc
    };
  }
}
window.__DC_Component = Component;
</script>
